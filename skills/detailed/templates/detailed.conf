# Fakty projektu dla skilla "detailed". Plik: <repo>/.claude/detailed.conf
# Format: klucz=wartość, jedna para w linii, bez komentarzy po wartości. Ścieżki względem katalogu repo.
# Czyta go hook przypomnień (scripts/reminders.sh) i Claude na początku każdego kroku.

# --- Projekt i ludzie ---
project=NAZWA-PROJEKTU
people=.claude/osoby.tsv
# Rola, której commit zamyka sprawy decyzyjne (bramka decyzyjna).
gate_role=pm
# Strony spoza zespołu wpisywane w kolumnie "Czeka na" (po przecinku) i próg zaległości w dniach.
external_parties=Klient
external_overdue_days=7

# --- Git ---
remote=origin
default_branch=main

# --- Zapis dla nas ---
# Jedyny rejestr pytań, spraw i decyzji.
register=docs/rejestr.md
# Katalogi z wiedzą (po przecinku); hook zgłasza w nich zmiany niezapisane w gicie.
knowledge_dirs=docs
# Mapa wiedzy (spis plików: co zawiera, kto zmienia, kiedy aktualizować) i migawka stanu projektu.
knowledge_map=docs/README.md
state=docs/stan-projektu.md
# Długość opisu w nazwie nowego pliku wiedzy (słowa), gdy CLAUDE.md nie ma własnej reguły nazw.
doc_name_words=2-5

# --- Log zdarzeń ---
# Jeden plik. Gdy projekt dzieli log według typu zdarzenia, podział opisuje CLAUDE.md
# (sekcja "Zdarzenie → co aktualizować"), a tu zostaje miejsce wpisów typu "decyzja".
event_log=docs/log-zdarzen.md
# Długość wpisu o scalonej zmianie w dzienniku realizacji (linie).
changelog_entry_lines=3-6

# --- Zapis dla klienta ---
# Skrzynka nadawcza (treści przygotowane, niewysłane) i archiwum tego, co faktycznie wysłano.
client_outbox=docs/do-wyslania
client_sent=docs/wyslane
# Tag w gicie dla wersji dokumentu wysłanej klientowi; <dokument> i <wersja> podstawia osoba wysyłająca.
sent_tag_format=<dokument>-<wersja>-wyslana
# Rola, która jako jedyna wysyła cokolwiek klientowi.
sender_role=pm

# --- Przypomnienia ---
reminder_interval_min=60
# Pobranie gałęzi domyślnej w tle przy wiadomościach: najwyżej co tyle minut.
fetch_interval_min=10
# Wierszy na listę, słów opisu sprawy w wierszu, linii, w których sesja podaje przypomnienia.
reminder_max_rows=8
reminder_subject_words=14
reminder_summary_lines=1-3

# --- Cykl realizacji (limity domyślne; projekt może je zmienić) ---
plan_max_tasks=15
task_max_days=1
review_max_cycles=2
acceptance_max_cycles=1

# --- Projekt graficzny ---
# Katalog eksportów projektu graficznego. Puste: projekt go nie ma i zasady spójności specyfikacja ↔ projekt nie obowiązują.
design=

# --- Nazwy kolumn rejestru (dokładnie jak w nagłówku tabeli) ---
col_id=ID
# Kolumna z opisem sprawy; kilka nazw po przecinku, gdy tabele rejestru nazywają ją różnie.
col_subject=Sprawa
col_waiting=Czeka na
col_since=Od
col_status=Status
col_scope=Zakres
col_assumption=Założenie robocze
col_blocks=Blokuje

# --- Statusy wierszy rejestru ---
status_open=otwarte
status_in_progress=w toku
status_proposal=propozycja
# Status zamknięcia (DD.MM i kto uzupełnia osoba zamykająca) i jego początek, po którym hook rozpoznaje sprawę zamkniętą.
status_closed=rozstrzygnięte DD.MM (kto)
status_closed_prefix=rozstrzygni
